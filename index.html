<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #0b1a3a;
  text-align: center;
}

/* Poster */
.poster {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: auto;
}

.poster img {
  width: 100%;
}

/* Name */
.name {
  position: absolute;
  top: 64%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 75%;
  text-align: center;

  font-family: 'Cinzel', serif;
  color: #1e2a5a;
  letter-spacing: 1px;

  line-height: 1.2;
  font-size: 30px;
  word-break: break-word;
}

/* Input */
input {
  margin-top: 20px;
  padding: 12px;
  width: 90%;
  border-radius: 8px;
  border: none;
}

/* Button */
button {
  margin-top: 10px;
  padding: 12px 20px;
  border: none;
  background: gold;
  font-weight: bold;
  border-radius: 8px;
}
</style>
</head>

<body>

<div id="capture" class="poster">
  <img src="poster.png">
  <div id="nameText" class="name">Your Name</div>
</div>

<input type="text" id="nameInput" placeholder="Enter your name">
<br>
<button onclick="downloadImage()">Download</button>

<script>
const input = document.getElementById("nameInput");
const text = document.getElementById("nameText");

/* AUTO NAME FIX */
input.addEventListener("input", () => {
  let name = input.value.trim();

  if (!name) {
    text.innerText = "Your Name";
  } else {
    text.innerHTML = formatName(name);
  }

  autoResize();
});

/* AUTO 2-LINE SPLIT */
function formatName(name) {
  let words = name.split(" ");

  if (words.length >= 2) {
    let mid = Math.ceil(words.length / 2);
    let line1 = words.slice(0, mid).join(" ");
    let line2 = words.slice(mid).join(" ");
    return line1 + "<br>" + line2;
  }

  return name;
}

/* AUTO FONT RESIZE */
function autoResize() {
  let size = 34;
  text.style.fontSize = size + "px";

  while (text.scrollWidth > text.offsetWidth && size > 16) {
    size--;
    text.style.fontSize = size + "px";
  }
}

/* DOWNLOAD */
function downloadImage() {
  html2canvas(document.getElementById("capture")).then(canvas => {
    let link = document.createElement("a");
    link.download = "convocation.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
