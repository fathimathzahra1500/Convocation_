<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocation Name Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
body{background:#0b1a3a;display:flex;flex-direction:column;align-items:center;padding:15px;}
h1{color:#fff;margin-bottom:12px;font-size:20px;text-align:center;}
.controls{width:100%;max-width:420px;display:flex;gap:10px;margin-bottom:15px;}
input{flex:1;padding:12px;border-radius:8px;border:none;font-size:16px;outline:none;}
button{padding:12px 16px;border-radius:8px;border:none;background:#1e3a8a;color:white;font-weight:600;cursor:pointer;}
button:hover{background:#162f6b;}
.poster-wrapper{width:100%;max-width:520px;aspect-ratio:1/1;position:relative;}
.poster{width:100%;height:100%;position:relative;}
.poster img{width:100%;height:100%;object-fit:contain;}
.name-box{position:absolute;left:50%;transform:translateX(-50%);bottom:22.5%;width:64%;height:9%;
display:flex;align-items:center;justify-content:center;overflow:hidden;}
.name-text{color:#1e3a8a;font-weight:700;letter-spacing:0.5px;white-space:nowrap;text-align:center;}
@media (max-width:480px){.controls{flex-direction:column;}button{width:100%;}}
</style>
</head>
<body>

<h1>🎓 Convocation Name Generator</h1>

<div class="controls">
<input type="text" id="nameInput" placeholder="Enter your name">
<button onclick="downloadImage()">Download Image</button>
</div>

<div class="poster-wrapper" id="captureArea">
<div class="poster">
<img src="poster.png" alt="Poster">
<div class="name-box" id="nameBox">
<div class="name-text" id="nameText">Your Name</div>
</div>
</div>
</div>

<script>
const input=document.getElementById("nameInput");
const nameText=document.getElementById("nameText");
const nameBox=document.getElementById("nameBox");

input.addEventListener("input",()=>{
const value=input.value.trim();
nameText.textContent=value||"Your Name";
autoFit();
});

function autoFit(){
let maxWidth=nameBox.clientWidth-10;
let maxHeight=nameBox.clientHeight;
let size=42;
nameText.style.fontSize=size+"px";

while((nameText.scrollWidth>maxWidth||nameText.scrollHeight>maxHeight)&&size>10){
size--;
nameText.style.fontSize=size+"px";
}
}

window.onload=autoFit;
window.onresize=autoFit;

function downloadImage(){
const element=document.getElementById("captureArea");
html2canvas(element,{scale:4,useCORS:true,backgroundColor:null}).then(canvas=>{
const link=document.createElement("a");
link.download="convocation.png";
link.href=canvas.toDataURL("image/png");
link.click();
});
}
</script>

</body>
</html>
