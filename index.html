<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Name Generator</title>

<!-- Royal Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #0b1a3a;
  font-family: 'Playfair Display', serif;
  text-align: center;
}

/* Title */
h2 {
  color: white;
  padding-top: 15px;
}

/* Poster container */
.poster-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 15px auto;
}

/* Poster image */
.poster-box img {
  width: 100%;
  border-radius: 12px;
}

/* NAME STYLE (FINAL FIXED) */
.name {
  position: absolute;
  top: 62%;   /* 🔥 FINAL PERFECT POSITION */
  left: 50%;
  transform: translate(-50%, -50%);
  width: 65%;

  text-align: center;
  font-family: 'Cinzel', serif;
  font-weight: 600;

  color: #1b2a57;
  letter-spacing: 1px;
  line-height: 1.2;

  text-shadow: 0px 1px 2px rgba(0,0,0,0.2);
}

/* Input */
input {
  width: 90%;
  max-width: 350px;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

/* Button */
button {
  margin-top: 10px;
  padding: 12px 20px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>🎓 Convocation Name Generator</h2>

<div id="capture" class="poster-box">
  <img src="poster.png" alt="poster">

  <div id="nameText" class="name">
    Your Name
  </div>
</div>

<input type="text" id="nameInput" placeholder="Enter your name">

<br>
<button onclick="downloadImage()">Download Image</button>

<script>
const input = document.getElementById("nameInput");
const text = document.getElementById("nameText");

/* AUTO UPDATE */
input.addEventListener("input", () => {
  let name = input.value.trim();

  if (!name) {
    text.innerText = "Your Name";
  } else {
    text.innerHTML = formatName(name);
  }

  autoResize();
});

/* 🔥 PERFECT 2-LINE SPLIT */
function formatName(name) {
  let words = name.trim().split(" ");

  if (words.length <= 2) {
    return words.join(" ");
  }

  let lastWord = words.pop();
  let firstLine = words.join(" ");

  return firstLine + "<br>" + lastWord;
}

/* AUTO FONT RESIZE */
function autoResize() {
  let size = 34;
  text.style.fontSize = size + "px";

  while (text.scrollWidth > text.offsetWidth && size > 16) {
    size--;
    text.style.fontSize = size + "px";
  }
}

/* DOWNLOAD */
function downloadImage() {
  html2canvas(document.getElementById("capture")).then(canvas => {
    let link = document.createElement("a");
    link.download = "convocation.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
